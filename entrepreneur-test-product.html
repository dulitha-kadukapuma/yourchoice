<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YourChoice – Test Product Demand</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="page-inner">

<header class="page-header">
  <a href="index.html" class="logo-link" onclick="event.preventDefault(); goTo('index.html')">YOUR<span>CHOICE</span></a>
  <button class="back-btn" onclick="goTo('entrepreneur-type.html')">← Back</button>
</header>

<div class="form-wrap">
  <h2 class="form-heading" style="margin-top:20px">📈 Test Product Demand</h2>
  <p class="form-sub">Define your target audience and we'll show real market insights.</p>

  <form id="entProductForm" novalidate>

    <div class="q-card" id="cardEntAge">
      <div class="q-label"><span class="q-icon">🎂</span> Target Age Group</div>
      <div class="radio-group">
        <div class="radio-opt"><input type="radio" name="entAge" id="ea1" value="8-18"/><label for="ea1">8–18</label></div>
        <div class="radio-opt"><input type="radio" name="entAge" id="ea2" value="19-25"/><label for="ea2">19–25</label></div>
        <div class="radio-opt"><input type="radio" name="entAge" id="ea3" value="26-40"/><label for="ea3">26–40</label></div>
        <div class="radio-opt"><input type="radio" name="entAge" id="ea4" value="40+"/><label for="ea4">40+</label></div>
      </div>
    </div>

    <div class="q-card" id="cardEntGender">
      <div class="q-label"><span class="q-icon">🧑</span> Target Gender</div>
      <div class="radio-group">
        <div class="radio-opt"><input type="radio" name="entGender" id="eg1" value="male"/><label for="eg1">Male</label></div>
        <div class="radio-opt"><input type="radio" name="entGender" id="eg2" value="female"/><label for="eg2">Female</label></div>
        <div class="radio-opt"><input type="radio" name="entGender" id="eg3" value="all"/><label for="eg3">All Genders</label></div>
      </div>
    </div>

    <div class="q-card" id="cardEntCountry">
      <div class="q-label"><span class="q-icon">🌍</span> Target Country</div>
      <select class="styled-select" id="countryEnt">
        <option value="">Select Country</option>
      </select>
    </div>

    <div class="q-card" id="cardEntCat">
      <div class="q-label"><span class="q-icon">📦</span> Product Category</div>
      <div class="radio-group">
        <div class="radio-opt"><input type="radio" name="entCategory" id="ec1" value="gift"/><label for="ec1">🎁 Gifts</label></div>
        <div class="radio-opt"><input type="radio" name="entCategory" id="ec2" value="clothes"/><label for="ec2">👕 Clothes</label></div>
        <div class="radio-opt"><input type="radio" name="entCategory" id="ec3" value="food"/><label for="ec3">🍔 Food</label></div>
        <div class="radio-opt"><input type="radio" name="entCategory" id="ec4" value="services"/><label for="ec4">🛠️ Services</label></div>
      </div>
    </div>

    <div class="q-card" id="cardEntPrice">
      <div class="q-label"><span class="q-icon">💰</span> Target Price Range</div>
      <div class="radio-group">
        <div class="radio-opt"><input type="radio" name="entPrice" id="ep1" value="under-1000"/><label for="ep1">Under Rs.1000</label></div>
        <div class="radio-opt"><input type="radio" name="entPrice" id="ep2" value="1000-3000"/><label for="ep2">Rs.1000–3000</label></div>
        <div class="radio-opt"><input type="radio" name="entPrice" id="ep3" value="3000-5000"/><label for="ep3">Rs.3000–5000</label></div>
        <div class="radio-opt"><input type="radio" name="entPrice" id="ep4" value="above-5000"/><label for="ep4">Above Rs.5000</label></div>
      </div>
    </div>

    <div class="btn-row">
      <button type="submit" class="btn btn-accent">📊 Analyze Market</button>
      <button type="button" class="btn btn-ghost" onclick="goTo('entrepreneur-type.html')">← Back</button>
    </div>

  </form>
</div>

<footer>
  <div class="foot-logo">YOUR<span>CHOICE</span></div>
  <p>Helping people discover what people love.</p>
</footer>

<script src="js/dataset.js"></script>
<script src="js/script.js"></script>
<script src="js/floating-animation.js"></script>
</body>
</html>
